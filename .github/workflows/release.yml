name: release

on:
  push:
    tags: ['cache-live-control--v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag sits on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag matches the manifest and CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#cache-live-control--v}"
          test "$v" = "$(node -p 'require("./plugins/cache-live-control/.claude-plugin/plugin.json").version')"
          scripts/release-check.sh
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ || /^\[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "cache-live-control ${GITHUB_REF_NAME#cache-live-control--v}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
