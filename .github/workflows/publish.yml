name: publish

# Merging the develop -> main pull request is the release: `publish` tags the
# merge commit cache-live-control--v{version} and creates the GitHub release from the
# version's CHANGELOG section. ci.yml gates the pull request before the merge;
# this re-runs no test. No tag is pushed by hand.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The tag is new
        id: tag
        run: |
          v="$(node -p 'require("./plugins/cache-live-control/.claude-plugin/plugin.json").version')"
          tag="cache-live-control--v$v"
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::$tag already exists"; exit 1; fi
          if [ "$rc" -ne 2 ]; then echo "::error::could not look up tag $tag (git ls-remote exit $rc)"; exit 1; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Release notes from the CHANGELOG
        env:
          v: ${{ steps.tag.outputs.v }}
        run: |
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ || /^\[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - run: gh release create "$tag" --target "${{ github.event.pull_request.merge_commit_sha }}" --title "cache-live-control $v" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ steps.tag.outputs.tag }}
          v: ${{ steps.tag.outputs.v }}
